<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Save with NB Clipper</title>
	<link rel="stylesheet" href="nb-clipper-popup.css">
</head>

<body>
	<main>
		<h1>NB Clipper</h1>

		<form id="loginForm" hidden>
			<label for="usernameInput">Username</label>
			<input id="usernameInput" type="text" autocomplete="username" required>

			<label for="passwordInput">Password</label>
			<input id="passwordInput" type="password" autocomplete="current-password" required>

			<button id="loginButton" type="submit">Log in</button>
		</form>

		<form id="saveForm" hidden>
			<label for="clientSelect">Client</label>
			<select id="clientSelect" required disabled>
				<option value="">Loading clients...</option>
			</select>
			<p id="clientJobDetails" class="client-job-details" hidden></p>

			<label for="itemSelect">Item</label>
			<select id="itemSelect" required disabled>
				<option value="">Select a client first</option>
			</select>

			<div id="customItemFields" hidden>
				<label for="customRoomInput">Room (required)</label>
				<input id="customRoomInput" type="text" autocomplete="off">

				<label for="customItemInput">PAW item name (required)</label>
				<input id="customItemInput" type="text" autocomplete="off">
				<p class="custom-item-help">Saved as Room - Item (for example, Kitchen - Countertop sample).</p>
			</div>

			<button id="saveButton" type="submit" disabled>Save</button>
		</form>

		<div id="signedInActions" class="signed-in-actions" hidden>
			<button id="settingsButton" type="button" class="secondary-button">&#9881; Settings</button>
			<button id="logoutButton" type="button" class="secondary-button">Log out</button>
		</div>

		<p id="status" role="status" aria-live="polite"></p>
	</main>

	<script src="../../../lib/chrome-browser-polyfill.js"></script>
	<script src="../../../lib/ui-nb-clipper-popup.js"></script>
</body>

</html>
